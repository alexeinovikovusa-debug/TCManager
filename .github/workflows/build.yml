name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract project
        run: unzip -q TCManager_cloud_build.zip -d .

      - name: Fix KSP version
        run: |
          sed -i 's/2.1.20-2.0.32/2.1.20-2.0.1/' tc_manager/build.gradle.kts

      - name: Fix JVM target
        run: |
          sed -i 's/android { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } namespace =/android { namespace =/' tc_manager/app/build.gradle.kts
          sed -i '/^android {/a\    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' tc_manager/app/build.gradle.kts
          sed -i '/^android {/a\    buildFeatures { buildConfig = true }' tc_manager/app/build.gradle.kts
          
      - name: Apply fixes
        run: |
          cp fixes/MainActivity.kt tc_manager/app/src/main/java/com/example/tcmanager/MainActivity.kt
          cp fixes/AppDatabase.kt tc_manager/app/src/main/java/com/example/tcmanager/data/AppDatabase.kt
          cp fixes/TenantData.kt tc_manager/app/src/main/java/com/example/tcmanager/data/TenantData.kt
          cp fixes/InspectionNotificationReceiver.kt tc_manager/app/src/main/java/com/example/tcmanager/InspectionNotificationReceiver.kt
          cp fixes/AndroidManifest.xml tc_manager/app/src/main/AndroidManifest.xml
          mkdir -p tc_manager/app/src/main/res/drawable tc_manager/app/src/main/res/mipmap-anydpi-v26
          mkdir -p tc_manager/app/src/main/res/values
          cp fixes/res/drawable/ic_launcher_foreground.xml tc_manager/app/src/main/res/drawable/ic_launcher_foreground.xml
          cp fixes/res/mipmap-anydpi-v26/ic_launcher.xml tc_manager/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp fixes/res/mipmap-anydpi-v26/ic_launcher_round.xml tc_manager/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp fixes/res/values/colors.xml tc_manager/app/src/main/res/values/colors.xml

      - name: Set build version
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="0.1.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/versionCode = [0-9]+; versionName = \"[^\"]+\"/versionCode = ${VERSION_CODE}; versionName = \"${VERSION_NAME}\"/" tc_manager/app/build.gradle.kts

      - name: Check source files
        run: |
          echo "=== MainActivity.kt ==="
          head -80 tc_manager/app/src/main/java/com/example/tcmanager/MainActivity.kt
          echo "=== AppDatabase.kt ==="
          head -80 tc_manager/app/src/main/java/com/example/tcmanager/data/AppDatabase.kt

      - name: Build APK
        working-directory: tc_manager
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TCManager-debug-apk
          path: tc_manager/app/build/outputs/apk/debug/app-debug.apk
